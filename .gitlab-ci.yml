stages:
  - build
  - test
  - docker

image: gradle:8.10-jdk21

build-job:
  stage: build
  script:
    - gradle build -x test

test-job:
  stage: test
  script:
    - gradle test

docker-build-push:
  stage: docker
  image: docker:latest
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'